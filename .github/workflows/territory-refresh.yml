name: Territory Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 1 * *'
  pull_request:
    paths:
      - 'data-sources/**'
      - 'scripts/**'

jobs:
  refresh:
    name: Refresh from upstream sources
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run territory pipeline
        run: npm run territory:pipeline -- --refresh-sources --strict

      - name: Open PR if data changed
        uses: peter-evans/create-pull-request@v6
        if: success()
        with:
          title: 'chore(territory): refresh from upstream sources'
          commit-message: 'chore(territory): refresh from upstream sources'
          branch: territory-refresh
          body: |
            Automated territory data refresh from upstream CEC/Census sources.

            Generated by the `territory:pipeline` scheduled workflow.

  check:
    name: Check committed runtime JSON is up to date
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check territory output matches committed files
        run: npm run territory:pipeline -- --check
